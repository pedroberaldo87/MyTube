name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.60 does not support yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Six of the tests launch a real Chromium and assert on what is rendered.
      # Without the browser installed they fail on their first line, so this step
      # is what makes the suite mean the same thing in CI as it does locally.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
